services:
  - type: web
    name: gymforus
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8000
      - key: DEBUG
        value: false
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://gymforus.onrender.com,http://localhost:8000,http://127.0.0.1:8000
      - key: AI_PROVIDER
        value: rule-based
      - key: AI_FALLBACK_ENABLED
        value: true
      - key: RATE_LIMIT_REQUESTS
        value: 60
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: 60
